services:
  # 1. Base de Datos Relacional (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_iot_agricola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_iot_agricola"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Motor de Series Temporales (InfluxDB 2.7)
  influxdb:
    image: influxdb:2.7
    container_name: iot_influxdb
    restart: unless-stopped
    ports:
      - "8181:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=mi_organizacion_agricola
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetria_sensores
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mi-token-agricola-123
    volumes:
      - influxdb_data:/var/lib/influxdb2

  # 3. Backend API (Django REST Framework + SimpleJWT)
  backend:
    build: ./backend_agricola
    container_name: iot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,172.22.0.221,100.114.198.44,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://172.22.0.221:5173,http://100.114.198.44:5173"
      DB_NAME: db_iot_agricola
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: "5432"
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_TOKEN: "mi-token-agricola-123"
      INFLUXDB_ORG: "mi_organizacion_agricola"
      INFLUXDB_BUCKET: "telemetria_sensores"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started

  # 4. Frontend SPA (React + Vite)
  frontend:
    build: ./frontend_agricola
    container_name: iot_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://100.114.198.44:8000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
  influxdb_data:
